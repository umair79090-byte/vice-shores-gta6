<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice Shores - Open World Crime Driving</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', 'Roboto', sans-serif; }
        #game-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #fff;
            pointer-events: none;
        }
        #wanted-level {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8), 2px 2px 2px #000;
            letter-spacing: 2px;
        }
        #speed {
            font-size: 24px;
            margin-top: 10px;
            color: #fff;
            text-shadow: 2px 2px 2px #000;
        }
        #mini-map {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            height: 180px;
            background: rgba(0,0,0,0.6);
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #mini-map-canvas {
            width: 100%;
            height: 100%;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: right;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="hud">
        <div id="wanted-level">WANTED: 0</div>
        <div id="speed">0 KM/H</div>
    </div>
    <div id="mini-map">
        <canvas id="mini-map-canvas"></canvas>
    </div>
    <div id="instructions">
        WASD TO DRIVE<br>
        ESCAPE TO PAUSE
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
