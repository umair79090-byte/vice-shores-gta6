<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice Shores - Open World Crime Driving</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #wanted-level {
            font-size: 24px;
            color: #ffcc00;
        }
        #mini-map {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 50%;
            overflow: hidden;
        }
        #mini-map-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="hud">
        <div id="wanted-level">WANTED: 0</div>
        <div id="speed">Speed: 0 km/h</div>
    </div>
    <div id="mini-map">
        <canvas id="mini-map-canvas"></canvas>
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
